&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;disk-merger-cube&#x27;);
  const beamInput = document.getElementById(&#x27;dmc-beam&#x27;);
  const dvInput = document.getElementById(&#x27;dmc-dv&#x27;);
  const beamValue = document.getElementById(&#x27;dmc-beam-value&#x27;);
  const dvValue = document.getElementById(&#x27;dmc-dv-value&#x27;);
  const mergerRatio = document.getElementById(&#x27;dmc-merger-ratio&#x27;);
  const note = document.getElementById(&#x27;dmc-note&#x27;);

  const NX = 34, NY = 34, NV = 45;
  const XMAX = 1.5, VMAX = 350;
  const dx = 2 * XMAX / (NX - 1);
  const dvChan = 2 * VMAX / (NV - 1);
  const inc = 55 * Math.PI / 180;
  const sigma = 35;

  function cssColor(name) {
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  function resolveColor(expression) {
    const probe = document.createElement(&#x27;span&#x27;);
    probe.style.color = expression;
    probe.style.display = &#x27;none&#x27;;
    root.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  }

  function mix(a, b, fraction) {
    const pct = Math.round(Math.max(0, Math.min(1, fraction)) * 100);
    return resolveColor(`color-mix(in srgb, ${a} ${pct}%, ${b})`);
  }

  function palette() {
    const bg = cssColor(&#x27;--background&#x27;);
    const fg = cssColor(&#x27;--foreground&#x27;);
    const muted = cssColor(&#x27;--muted&#x27;);
    const border = cssColor(&#x27;--border&#x27;);
    // Fixed, colour-blind-friendly scientific palette. These do not depend on
    // host-page CSS variables, so they also work in a standalone HTML file.
    const blue = &#x27;#3b4cc0&#x27;;       // approaching emission
    const red = &#x27;#b40426&#x27;;        // receding emission
    const moment0 = &#x27;#e69f00&#x27;;    // integrated-intensity map
    const bright = &#x27;#009e73&#x27;;     // PV diagram
    const diverging = [];
    const intensity = [];
    const pv = [];
    for (let i = 0; i &lt; 101; i++) {
      const t = i / 100;
      if (t &lt; 0.5) diverging.push(mix(blue, muted, 1 - 2 * t));
      else diverging.push(mix(red, muted, 2 * t - 1));
      intensity.push(mix(moment0, bg, Math.pow(t, 0.65)));
      pv.push(mix(bright, bg, Math.pow(t, 0.55)));
    }
    return { bg, fg, muted, border, diverging, intensity, pv };
  }

  function idx(x, y, v) {
    return (y * NX + x) * NV + v;
  }

  function gaussian(v, mean, width) {
    const z = (v - mean) / width;
    return Math.exp(-0.5 * z * z);
  }

  function buildCube(kind, deltaV) {
    const cube = new Float32Array(NX * NY * NV);
    for (let iy = 0; iy &lt; NY; iy++) {
      const y = -XMAX + iy * dx;
      for (let ix = 0; ix &lt; NX; ix++) {
        const x = -XMAX + ix * dx;
        if (kind === &#x27;disk&#x27;) {
          const yd = y / Math.cos(inc);
          const r = Math.sqrt(x * x + yd * yd) + 1e-5;
          const brightness = Math.exp(-r / 0.55);
          const vrot = 240 * (1 - Math.exp(-r / 0.28));
          const mean = vrot * Math.sin(inc) * x / r;
          for (let iv = 0; iv &lt; NV; iv++) {
            const vel = -VMAX + iv * dvChan;
            cube[idx(ix, iy, iv)] = brightness * gaussian(vel, mean, sigma);
          }
        } else {
          const components = [
            { x: -0.43, y: 0.10, sx: 0.29, sy: 0.23, amp: 1.00, vel: -deltaV / 2 },
            { x:  0.43, y: -0.10, sx: 0.25, sy: 0.30, amp: 0.82, vel:  deltaV / 2 }
          ];
          for (const c of components) {
            const rx = (x - c.x) / c.sx;
            const ry = (y - c.y) / c.sy;
            const brightness = c.amp * Math.exp(-0.5 * (rx * rx + ry * ry));
            const localShear = 28 * (x - c.x) / c.sx;
            for (let iv = 0; iv &lt; NV; iv++) {
              const vel = -VMAX + iv * dvChan;
              cube[idx(ix, iy, iv)] += brightness * gaussian(vel, c.vel + localShear, sigma);
            }
          }
          const bridge = 0.18 * Math.exp(-0.5 * ((x / 0.62) ** 2 + (y / 0.17) ** 2));
          const bridgeVelocity = (deltaV / 2) * Math.max(-1, Math.min(1, x / 0.43));
          for (let iv = 0; iv &lt; NV; iv++) {
            const vel = -VMAX + iv * dvChan;
            cube[idx(ix, iy, iv)] += bridge * gaussian(vel, bridgeVelocity, 55);
          }
        }
      }
    }
    return cube;
  }

  function convolveSpatial(cube, beamFwhm) {
    const sigmaPix = beamFwhm / 2.355 / dx;
    if (sigmaPix &lt; 0.35) return cube;
    const radius = Math.max(1, Math.ceil(3 * sigmaPix));
    const kernel = [];
    let norm = 0;
    for (let k = -radius; k &lt;= radius; k++) {
      const w = Math.exp(-0.5 * (k / sigmaPix) ** 2);
      kernel.push(w);
      norm += w;
    }
    for (let i = 0; i &lt; kernel.length; i++) kernel[i] /= norm;

    const temp = new Float32Array(cube.length);
    const out = new Float32Array(cube.length);
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) for (let v = 0; v &lt; NV; v++) {
      let sum = 0;
      for (let k = -radius; k &lt;= radius; k++) {
        const xx = Math.max(0, Math.min(NX - 1, x + k));
        sum += cube[idx(xx, y, v)] * kernel[k + radius];
      }
      temp[idx(x, y, v)] = sum;
    }
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) for (let v = 0; v &lt; NV; v++) {
      let sum = 0;
      for (let k = -radius; k &lt;= radius; k++) {
        const yy = Math.max(0, Math.min(NY - 1, y + k));
        sum += temp[idx(x, yy, v)] * kernel[k + radius];
      }
      out[idx(x, y, v)] = sum;
    }
    return out;
  }

  function moments(cube) {
    const m0 = new Float32Array(NX * NY);
    const m1 = new Float32Array(NX * NY);
    let max0 = 0;
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) {
      let sum = 0, weighted = 0;
      for (let v = 0; v &lt; NV; v++) {
        const value = cube[idx(x, y, v)];
        const vel = -VMAX + v * dvChan;
        sum += value;
        weighted += value * vel;
      }
      m0[y * NX + x] = sum;
      m1[y * NX + x] = sum &gt; 0 ? weighted / sum : 0;
      max0 = Math.max(max0, sum);
    }
    return { m0, m1, max0 };
  }

  function pvDiagram(cube) {
    const pv = new Float32Array(NX * NV);
    let max = 0;
    const halfWidth = 5;
    const yc = Math.floor(NY / 2);
    for (let x = 0; x &lt; NX; x++) for (let v = 0; v &lt; NV; v++) {
      let sum = 0;
      for (let y = Math.max(0, yc - halfWidth); y &lt;= Math.min(NY - 1, yc + halfWidth); y++) {
        sum += cube[idx(x, y, v)];
      }
      pv[v * NX + x] = sum;
      max = Math.max(max, sum);
    }
    return { pv, max };
  }

  function prepareCanvas(canvas, colors) {
    const ctx = canvas.getContext(&#x27;2d&#x27;);
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, W, H);
    return { ctx, W, H, left: 72, right: 20, top: 18, bottom: 55 };
  }

  function drawAxes(g, xlabel, ylabel, colors) {
    const { ctx, W, H, left, right, top, bottom } = g;
    ctx.strokeStyle = colors.border;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left, top);
    ctx.lineTo(left, H - bottom);
    ctx.lineTo(W - right, H - bottom);
    ctx.stroke();
    ctx.fillStyle = colors.fg;
    ctx.font = &#x27;24px sans-serif&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(xlabel, (left + W - right) / 2, H - 12);
    ctx.save();
    ctx.translate(22, (top + H - bottom) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(ylabel, 0, 0);
    ctx.restore();
    ctx.font = &#x27;20px sans-serif&#x27;;
    ctx.fillStyle = colors.muted;
    ctx.fillText(&#x27;-1.5&#x27;, left, H - bottom + 28);
    ctx.fillText(&#x27;0&#x27;, (left + W - right) / 2, H - bottom + 28);
    ctx.fillText(&#x27;+1.5&#x27;, W - right, H - bottom + 28);
  }

  function drawBeam(g, beamFwhm, colors) {
    const { ctx, W, H, left, right, top, bottom } = g;
    const pw = W - left - right, ph = H - top - bottom;
    const major = beamFwhm / (2 * XMAX) * pw;
    const minor = 0.72 * major;
    const cx = left + 16 + major / 2;
    const cy = top + ph - 16 - minor / 2;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, major / 2, minor / 2, -0.35, 0, 2 * Math.PI);
    ctx.fillStyle = colors.bg;
    ctx.fill();
    ctx.strokeStyle = colors.fg;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
  }

  function drawMap(canvas, moment, type, colors, beamFwhm) {
    const g = prepareCanvas(canvas, colors);
    const { ctx, W, H, left, right, top, bottom } = g;
    const pw = W - left - right, ph = H - top - bottom;
    const cw = pw / NX, ch = ph / NY;
    const threshold = moment.max0 * 0.025;
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) {
      const k = y * NX + x;
      let color;
      if (type === &#x27;m0&#x27;) {
        const t = Math.min(1, moment.m0[k] / moment.max0);
        color = colors.intensity[Math.round(100 * Math.pow(t, 0.55))];
      } else if (moment.m0[k] &lt; threshold) {
        color = colors.bg;
      } else {
        const vel = Math.max(-220, Math.min(220, moment.m1[k]));
        color = colors.diverging[Math.round(50 + 50 * vel / 220)];
      }
      ctx.fillStyle = color;
      ctx.fillRect(left + x * cw, top + (NY - 1 - y) * ch, cw + 0.6, ch + 0.6);
    }
    drawBeam(g, beamFwhm, colors);
    drawAxes(g, &#x27;Offset (kpc)&#x27;, &#x27;Offset (kpc)&#x27;, colors);
  }

  function drawPV(canvas, pvData, colors) {
    const g = prepareCanvas(canvas, colors);
    const { ctx, W, H, left, right, top, bottom } = g;
    const pw = W - left - right, ph = H - top - bottom;
    const cw = pw / NX, ch = ph / NV;
    for (let v = 0; v &lt; NV; v++) for (let x = 0; x &lt; NX; x++) {
      const t = Math.min(1, pvData.pv[v * NX + x] / pvData.max);
      ctx.fillStyle = colors.pv[Math.round(100 * Math.pow(t, 0.55))];
      ctx.fillRect(left + x * cw, top + (NV - 1 - v) * ch, cw + 0.6, ch + 0.6);
    }
    drawAxes(g, &#x27;Major-axis offset (kpc)&#x27;, &#x27;Velocity (km s⁻¹)&#x27;, colors);
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const y0 = top + ph / 2;
    ctx.moveTo(left, y0);
    ctx.lineTo(W - right, y0);
    ctx.stroke();
    ctx.fillStyle = colors.muted;
    ctx.font = &#x27;20px sans-serif&#x27;;
    ctx.textAlign = &#x27;right&#x27;;
    ctx.fillText(&#x27;+350&#x27;, left - 8, top + 7);
    ctx.fillText(&#x27;0&#x27;, left - 8, y0 + 7);
    ctx.fillText(&#x27;-350&#x27;, left - 8, top + ph + 7);
  }

  let renderTimer;
  function render() {
    const beam = Number(beamInput.value);
    const deltaV = Number(dvInput.value);
    beamValue.textContent = beam.toFixed(2);
    dvValue.textContent = deltaV.toFixed(0);
    const inferredV = (deltaV / 2) / Math.sin(inc);
    mergerRatio.textContent = `Disk-fit V/σ ≈ ${(inferredV / sigma).toFixed(1)}`;

    const colors = palette();
    const diskCube = convolveSpatial(buildCube(&#x27;disk&#x27;, deltaV), beam);
    const mergerCube = convolveSpatial(buildCube(&#x27;merger&#x27;, deltaV), beam);
    const diskMom = moments(diskCube);
    const mergerMom = moments(mergerCube);

    drawMap(document.getElementById(&#x27;dmc-disk-m0&#x27;), diskMom, &#x27;m0&#x27;, colors, beam);
    drawMap(document.getElementById(&#x27;dmc-disk-m1&#x27;), diskMom, &#x27;m1&#x27;, colors, beam);
    drawPV(document.getElementById(&#x27;dmc-disk-pv&#x27;), pvDiagram(diskCube), colors);
    drawMap(document.getElementById(&#x27;dmc-merger-m0&#x27;), mergerMom, &#x27;m0&#x27;, colors, beam);
    drawMap(document.getElementById(&#x27;dmc-merger-m1&#x27;), mergerMom, &#x27;m1&#x27;, colors, beam);
    drawPV(document.getElementById(&#x27;dmc-merger-pv&#x27;), pvDiagram(mergerCube), colors);

    if (beam &gt;= 0.55) {
      note.textContent = &#x27;With strong beam smearing, the merger components blend into an especially disk-like velocity gradient.&#x27;;
    } else if (beam &lt;= 0.20) {
      note.textContent = &#x27;At finer resolution, the merger retains two brightness peaks and a discontinuous PV structure.&#x27;;
    } else {
      note.textContent = &#x27;At this beam size, spatial and spectral blending turns two narrow components into a smooth red-to-blue gradient.&#x27;;
    }
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 40);
  }

  beamInput.addEventListener(&#x27;input&#x27;, scheduleRender);
  dvInput.addEventListener(&#x27;input&#x27;, scheduleRender);
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
