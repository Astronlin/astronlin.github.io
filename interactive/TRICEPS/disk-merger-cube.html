.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;disk-merger-cube&quot; aria-label=&quot;Comparison of a rotating disk and a merger in a spectral cube&quot;&gt;
  &lt;nav class=&quot;dmc-top-nav&quot; aria-label=&quot;RotVis navigation&quot;&gt;
    &lt;a href=&quot;/&quot; target=&quot;_top&quot;&gt;Home&lt;/a&gt;
    &lt;a href=&quot;/interactive/TRICEPS/rotvis-manual.html&quot; target=&quot;_top&quot;&gt;User manual&lt;/a&gt;
  &lt;/nav&gt;

  &lt;details class=&quot;dmc-assumptions&quot; open&gt;
    &lt;summary&gt;Model assumptions&lt;/summary&gt;
    &lt;div class=&quot;dmc-assumption-grid&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Disk:&lt;/strong&gt; thin exponential disk; inclination &lt;span id=&quot;dmc-inc-assumption&quot;&gt;55&lt;/span&gt;°; &lt;span id=&quot;dmc-curve-assumption&quot;&gt;pure-disk&lt;/span&gt; rotation curve; equivalent disk mass 1.50 × 10&lt;sup&gt;10&lt;/sup&gt; M&lt;sub&gt;☉&lt;/sub&gt;; bulge mass &lt;span id=&quot;dmc-bulge-mass-assumption&quot;&gt;3.00 × 10&lt;sup&gt;9&lt;/sup&gt; M&lt;sub&gt;☉&lt;/sub&gt;&lt;/span&gt; (&lt;span id=&quot;dmc-bulge-fraction-assumption&quot;&gt;20.0%&lt;/span&gt; of the disk); SMBH mass &lt;span id=&quot;dmc-bh-mass-assumption&quot;&gt;1.50 × 10&lt;sup&gt;8&lt;/sup&gt; M&lt;sub&gt;☉&lt;/sub&gt;&lt;/span&gt; (&lt;span id=&quot;dmc-bh-fraction-assumption&quot;&gt;1.00%&lt;/span&gt; of the disk); intrinsic dispersion 35 km s⁻¹.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Merger:&lt;/strong&gt; two offset Gaussian components separated by &lt;span id=&quot;dmc-separation-assumption&quot;&gt;0.88&lt;/span&gt; kpc in projection, with a tunable velocity separation, mild internal shear, and a faint connecting component.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Resolution:&lt;/strong&gt; circular Gaussian spatial FWHM and Gaussian spectral FWHM; spatial pixels are FWHM/3, the disk centre is registered to a pixel, and every panel retains a fixed 5 kpc field of view (±2.5 kpc). PV and spectral velocity axes expand automatically when required. Disk and merger can be synchronized or varied independently.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;dmc-inc&quot;&gt;
      Disk inclination: &lt;span class=&quot;dmc-value-unit&quot;&gt;&lt;span id=&quot;dmc-inc-value&quot;&gt;55&lt;/span&gt;°&lt;/span&gt;
      &lt;span class=&quot;dmc-slider-control&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;dmc-step&quot; data-target=&quot;dmc-inc&quot; data-direction=&quot;-1&quot; aria-label=&quot;Decrease disk inclination&quot;&gt;−&lt;/button&gt;&lt;input class=&quot;form-range&quot; id=&quot;dmc-inc&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;89&quot; step=&quot;1&quot; value=&quot;55&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;dmc-step&quot; data-target=&quot;dmc-inc&quot; data-direction=&quot;1&quot; aria-label=&quot;Increase disk inclination&quot;&gt;+&lt;/button&gt;&lt;/span&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;dmc-velocity-disk&quot;&gt;

      &lt;span class=&quot;dmc-slider-control&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;dmc-step&quot; data-target=&quot;dmc-bh-logmass&quot; data-direction=&quot;-1&quot; aria-label=&quot;Decrease supermassive black-hole mass&quot;&gt;−&lt;/button&gt;&lt;input class=&quot;form-range&quot; id=&quot;dmc-bh-logmass&quot; type=&quot;range&quot; min=&quot;6&quot; max=&quot;10&quot; step=&quot;0.05&quot; value=&quot;8.18&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;dmc-step&quot; data-target=&quot;dmc-bh-logmass&quot; data-direction=&quot;1&quot; aria-label=&quot;Increase supermassive black-hole mass&quot;&gt;+&lt;/button&gt;&lt;/span&gt;

  const bulgeMassInput = document.getElementById(&#x27;dmc-bulge-logmass&#x27;);

  const curveAssumption = document.getElementById(&#x27;dmc-curve-assumption&#x27;);
  const separationAssumption = document.getElementById(&#x27;dmc-separation-assumption&#x27;);
  const diskSpatialValue = document.getElementById(&#x27;dmc-spatial-disk-value&#x27;);
  const mergerSpatialValue = document.getElementById(&#x27;dmc-spatial-merger-value&#x27;);
  const diskVelocityValue = document.getElementById(&#x27;dmc-velocity-disk-value&#x27;);
  const mergerVelocityValue = document.getElementById(&#x27;dmc-velocity-merger-value&#x27;);
  const dvValue = document.getElementById(&#x27;dmc-dv-value&#x27;);
  const separationValue = document.getElementById(&#x27;dmc-separation-value&#x27;);

  const DISK_MATCH_RADIUS = 2.2 * DISK_SCALE_LENGTH;
  const DISK_MATCH_SPEED = DISK_ASYMPTOTIC_SPEED * (1 - Math.exp(-DISK_MATCH_RADIUS / DISK_TURN_RADIUS));
  const DISK_MASS = (DISK_MATCH_SPEED / EXPONENTIAL_DISK_PEAK_FACTOR) ** 2 * DISK_SCALE_LENGTH / G;
  const BULGE_MASS = 0.20 * DISK_MASS;
  const BH_MASS = 0.01 * DISK_MASS;

  function formatMassHTML(mass) {
    const exponent = Math.floor(Math.log10(mass));
    const coefficient = mass / 10 ** exponent;
    return `${coefficient.toFixed(2)} × 10&lt;sup&gt;${exponent}&lt;/sup&gt; M&lt;sub&gt;☉&lt;/sub&gt;`;
  }

  function formatMassFraction(mass) {
    const percent = 100 * mass / DISK_MASS;
    if (percent &lt; 0.1) return `${percent.toFixed(3)}%`;
    if (percent &lt; 1) return `${percent.toFixed(2)}%`;
    return `${percent.toFixed(1)}%`;
  }

  function updateBlackHoleControl(renderAfter = true) {
    bhControl.hidden = curveInput.value !== &#x27;bh-bulge-disk&#x27;;
    const mass = 10 ** Number(bhMassInput.value);
    const formatted = formatMassHTML(mass);
    bhMassValue.innerHTML = formatted;
    bhMassAssumption.innerHTML = formatted;
    bhFractionAssumption.textContent = formatMassFraction(mass);
    if (renderAfter) scheduleRender();
  }

  function updateBulgeControl(renderAfter = true) {
    bulgeControl.hidden = curveInput.value === &#x27;disk&#x27;;
    const mass = 10 ** Number(bulgeMassInput.value);
    const formatted = formatMassHTML(mass);
    bulgeMassValue.innerHTML = formatted;
    bulgeMassAssumption.innerHTML = formatted;
    bulgeFractionAssumption.textContent = formatMassFraction(mass);
    if (renderAfter) scheduleRender();
  }

    updateBulgeControl(false);
    updateBlackHoleControl(false);
    if (renderAfter) scheduleRender();

    // Keep an odd-sized, centre-registered grid: the intrinsic disk peak is

    dx = spatialFwhm / 3;
    dvChan = velocityFwhm;
    cubeVmax = Math.max(DISPLAY_VMAX, Math.ceil(velocityExtent / dvChan) * dvChan);
    gridRadius = XMAX;
    NX = 2 * Math.ceil(gridRadius / dx) + 1;
    NY = NX;
    NV = Math.ceil(2 * cubeVmax / dvChan) + 1;
  }

  function displayRadius(spatialFwhm) {
    return XMAX;
  }

  function cssColor(name) {
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  function resolveColor(expression) {
    const probe = document.createElement(&#x27;span&#x27;);
    probe.style.color = expression;
    probe.style.display = &#x27;none&#x27;;
    root.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  }

  function mix(a, b, fraction) {
    const pct = Math.round(Math.max(0, Math.min(1, fraction)) * 100);
    return resolveColor(`color-mix(in srgb, ${a} ${pct}%, ${b})`);
  }

  function ramp(stops) {
    const colors = [];
    for (let i = 0; i &lt;= 100; i++) {
      const t = i / 100;
      let left = stops[0], right = stops[stops.length - 1];
      for (let j = 0; j &lt; stops.length - 1; j++) {
        if (t &gt;= stops[j][0] &amp;&amp; t &lt;= stops[j + 1][0]) {
          left = stops[j];
          right = stops[j + 1];
          break;
        }
      }
      const fraction = (t - left[0]) / Math.max(1e-8, right[0] - left[0]);
      colors.push(mix(left[1], right[1], 1 - fraction));
    }
    return colors;
  }

  function palette() {
    const bg = &#x27;#ffffff&#x27;;
    const fg = &#x27;#161616&#x27;;
    const muted = &#x27;#6b6b6b&#x27;;
    const border = &#x27;#222222&#x27;;
    // Matplotlib-like ramps: gist_heat_r (M0), bwr (M1), Blues (M2), and Greys (PV).
    const intensity = ramp([
      [0.00, &#x27;#ffffff&#x27;], [0.18, &#x27;#fff8a8&#x27;], [0.45, &#x27;#ffae2f&#x27;],
      [0.72, &#x27;#b00016&#x27;], [1.00, &#x27;#000000&#x27;]
    ]);
    const diverging = ramp([
      [0.00, &#x27;#0000ff&#x27;], [0.50, &#x27;#ffffff&#x27;], [1.00, &#x27;#ff0000&#x27;]
    ]);
    const dispersion = ramp([
      [0.00, &#x27;#ffffff&#x27;], [0.25, &#x27;#c6dbef&#x27;], [0.50, &#x27;#6baed6&#x27;],
      [0.75, &#x27;#2171b5&#x27;], [1.00, &#x27;#08306b&#x27;]
    ]);
    const pv = ramp([
      [0.00, &#x27;#ffffff&#x27;], [1.00, &#x27;#000000&#x27;]
    ]);
    return { bg, fg, muted, border, diverging, dispersion, intensity, pv };
  }

  function idx(x, y, v) {
    return (y * NX + x) * NV + v;
  }

  function gaussian(v, mean, width) {
    const z = (v - mean) / width;
    return Math.exp(-0.5 * z * z);
  }

  function rotationSpeed(r, curveType, bulgeMass = BULGE_MASS, blackHoleMass = BH_MASS) {
    const disk = DISK_ASYMPTOTIC_SPEED * (1 - Math.exp(-r / DISK_TURN_RADIUS));
    if (curveType === &#x27;disk&#x27;) return disk;

    // Hernquist-like compact bulge contribution.
    const bulgeScale = 0.25;
    const bulge2 = G * bulgeMass * r / (r + bulgeScale) ** 2;
    if (curveType === &#x27;bulge-disk&#x27;) return Math.sqrt(disk ** 2 + bulge2);

    // Central SMBH contribution for the selected mass.
    const bh2 = G * blackHoleMass / Math.max(r, 0.025);
    return Math.sqrt(disk ** 2 + bulge2 + bh2);
  }

  function maximumProjectedDiskSpeed(inclination, curveType, bulgeMass, blackHoleMass) {
    let maximumProjectedSpeed = 0;
    // Sample the emitting disk, including the unresolved central 25 pc used
    // by the SMBH softening prescription.
    for (let k = 0; k &lt;= 600; k++) {
      const radius = 0.025 + k * (3 - 0.025) / 600;
      maximumProjectedSpeed = Math.max(
        maximumProjectedSpeed,
        rotationSpeed(radius, curveType, bulgeMass, blackHoleMass) * Math.sin(inclination)
      );
    }
    return maximumProjectedSpeed;
  }

  function diskVelocityExtent(inclination, curveType, bulgeMass, blackHoleMass, spectralFwhm) {
    const maximumProjectedSpeed = maximumProjectedDiskSpeed(
      inclination, curveType, bulgeMass, blackHoleMass
    );
    // Preserve essentially all intrinsic and instrumental Gaussian line flux.
    return maximumProjectedSpeed + 5 * sigma + 3 * spectralFwhm / 2.355;
  }

  function diskVisibleVelocityLimit(inclination, curveType, bulgeMass, blackHoleMass) {
    const maximumProjectedSpeed = maximumProjectedDiskSpeed(
      inclination, curveType, bulgeMass, blackHoleMass
    );
    // The displayed disk range follows only the intrinsic model. It therefore
    // remains fixed when either spatial or spectral resolution is changed.
    return Math.max(DISPLAY_VMAX, Math.ceil((maximumProjectedSpeed + 2 * sigma) / 50) * 50);
  }

  function mergerVelocityExtent(deltaV, spectralFwhm) {
    const internalShearMargin = 70;
    return Math.abs(deltaV) / 2 + internalShearMargin + 5 * sigma + 3 * spectralFwhm / 2.355;
  }

  function visibleVelocityLimit(internalExtent, spectralFwhm) {
    // Show the kinematic signal and roughly two intrinsic Gaussian sigmas,
    // while retaining a stable ±350 km/s minimum and tidy 50 km/s limits.
    const usefulExtent = internalExtent - 3 * sigma - 2 * spectralFwhm / 2.355;
    return Math.max(DISPLAY_VMAX, Math.ceil(usefulExtent / 50) * 50);
  }

  function buildCube(kind, deltaV, inclination, curveType, mergerSeparation, bulgeMass, blackHoleMass) {
    const cube = new Float32Array(NX * NY * NV);
    for (let iy = 0; iy &lt; NY; iy++) {
      const y = (iy - (NY - 1) / 2) * dx;
      for (let ix = 0; ix &lt; NX; ix++) {
        const x = (ix - (NX - 1) / 2) * dx;
        if (kind === &#x27;disk&#x27;) {
          const yd = y / Math.cos(inclination);
          const r = Math.sqrt(x * x + yd * yd) + 1e-5;
          const brightness = Math.exp(-r / DISK_SCALE_LENGTH);
          const vrot = rotationSpeed(r, curveType, bulgeMass, blackHoleMass);
          const mean = vrot * Math.sin(inclination) * x / r;
          for (let iv = 0; iv &lt; NV; iv++) {
            const vel = -cubeVmax + iv * dvChan;
            cube[idx(ix, iy, iv)] = brightness * gaussian(vel, mean, sigma);
          }
        } else {
          const originalSeparation = Math.hypot(0.86, 0.20);
          const ux = 0.86 / originalSeparation;
          const uy = -0.20 / originalSeparation;
          const halfSeparation = mergerSeparation / 2;
          const components = [
            { x: -halfSeparation * ux, y: -halfSeparation * uy, sx: 0.29, sy: 0.23, amp: 1.00, vel: -deltaV / 2 },
            { x:  halfSeparation * ux, y:  halfSeparation * uy, sx: 0.25, sy: 0.30, amp: 0.82, vel:  deltaV / 2 }
          ];
          for (const c of components) {
            const rx = (x - c.x) / c.sx;
            const ry = (y - c.y) / c.sy;
            const brightness = c.amp * Math.exp(-0.5 * (rx * rx + ry * ry));
            const localShear = 28 * (x - c.x) / c.sx;
            for (let iv = 0; iv &lt; NV; iv++) {
              const vel = -cubeVmax + iv * dvChan;
              cube[idx(ix, iy, iv)] += brightness * gaussian(vel, c.vel + localShear, sigma);
            }
          }
          const alongBridge = x * ux + y * uy;
          const acrossBridge = -x * uy + y * ux;
          const bridgeScale = Math.max(0.20, 0.70 * mergerSeparation);
          const bridge = 0.18 * Math.exp(-0.5 * ((alongBridge / bridgeScale) ** 2 + (acrossBridge / 0.17) ** 2));
          const bridgeVelocity = (deltaV / 2) * Math.max(-1, Math.min(1, alongBridge / halfSeparation));
          for (let iv = 0; iv &lt; NV; iv++) {
            const vel = -cubeVmax + iv * dvChan;
            cube[idx(ix, iy, iv)] += bridge * gaussian(vel, bridgeVelocity, 55);
          }
        }
      }
    }
    return cube;
  }

  function convolveSpatial(cube, beamFwhm) {
    const sigmaPix = beamFwhm / 2.355 / dx;
    if (sigmaPix &lt; 0.35) return cube;
    const radius = Math.max(1, Math.ceil(3 * sigmaPix));
    const kernel = [];
    let norm = 0;
    for (let k = -radius; k &lt;= radius; k++) {
      const w = Math.exp(-0.5 * (k / sigmaPix) ** 2);
      kernel.push(w);
      norm += w;
    }
    for (let i = 0; i &lt; kernel.length; i++) kernel[i] /= norm;

    const temp = new Float32Array(cube.length);
    const out = new Float32Array(cube.length);
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) for (let v = 0; v &lt; NV; v++) {
      let sum = 0;
      for (let k = -radius; k &lt;= radius; k++) {
        const xx = Math.max(0, Math.min(NX - 1, x + k));
        sum += cube[idx(xx, y, v)] * kernel[k + radius];
      }
      temp[idx(x, y, v)] = sum;
    }
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) for (let v = 0; v &lt; NV; v++) {
      let sum = 0;
      for (let k = -radius; k &lt;= radius; k++) {
        const yy = Math.max(0, Math.min(NY - 1, y + k));
        sum += temp[idx(x, yy, v)] * kernel[k + radius];
      }
      out[idx(x, y, v)] = sum;
    }
    return out;
  }

  function convolveSpectral(cube, fwhm) {
    const sigmaChan = fwhm / 2.355 / dvChan;
    if (sigmaChan &lt; 0.20) return cube;
    const radius = Math.max(1, Math.ceil(3 * sigmaChan));
    const kernel = [];
    let norm = 0;
    for (let k = -radius; k &lt;= radius; k++) {
      const w = Math.exp(-0.5 * (k / sigmaChan) ** 2);
      kernel.push(w);
      norm += w;
    }
    for (let i = 0; i &lt; kernel.length; i++) kernel[i] /= norm;

    const out = new Float32Array(cube.length);
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) for (let v = 0; v &lt; NV; v++) {
      let sum = 0;
      for (let k = -radius; k &lt;= radius; k++) {
        const vv = Math.max(0, Math.min(NV - 1, v + k));
        sum += cube[idx(x, y, vv)] * kernel[k + radius];
      }
      out[idx(x, y, v)] = sum;
    }
    return out;
  }

  function moments(cube) {
    const m0 = new Float32Array(NX * NY);
    const m1 = new Float32Array(NX * NY);
    const m2 = new Float32Array(NX * NY);
    let max0 = 0;
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) {
      let sum = 0, weighted = 0, weightedSquare = 0;
      for (let v = 0; v &lt; NV; v++) {
        const value = cube[idx(x, y, v)];
        const vel = -cubeVmax + v * dvChan;
        sum += value;
        weighted += value * vel;
        weightedSquare += value * vel * vel;
      }
      const k = y * NX + x;
      const mean = sum &gt; 0 ? weighted / sum : 0;
      m0[k] = sum;
      m1[k] = mean;
      m2[k] = sum &gt; 0 ? Math.sqrt(Math.max(0, weightedSquare / sum - mean * mean)) : 0;
      max0 = Math.max(max0, sum);
    }
    return { m0, m1, m2, max0 };
  }

  function globalSpectrum(cube) {
    const flux = new Float64Array(NV);
    let max = 0;
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) {
      for (let v = 0; v &lt; NV; v++) flux[v] += cube[idx(x, y, v)];
    }
    for (let v = 0; v &lt; NV; v++) max = Math.max(max, flux[v]);
    return { flux, max, channelWidth: dvChan, velocityMin: -cubeVmax };
  }

  function pvDiagram(cube, axis = &#x27;major&#x27;) {
    const positionCount = axis === &#x27;major&#x27; ? NX : NY;
    const pv = new Float32Array(positionCount * NV);
    let max = 0;
    // Spatial pixels are beam FWHM / 3, so the central pixel plus one pixel
    // on either side gives an extraction strip exactly one beam FWHM wide.
    const halfWidth = 1;
    const xc = Math.floor(NX / 2);
    const yc = Math.floor(NY / 2);
    for (let position = 0; position &lt; positionCount; position++) for (let v = 0; v &lt; NV; v++) {
      let sum = 0;
      if (axis === &#x27;major&#x27;) {
        for (let y = Math.max(0, yc - halfWidth); y &lt;= Math.min(NY - 1, yc + halfWidth); y++) {
          sum += cube[idx(position, y, v)];
        }
      } else {
        for (let x = Math.max(0, xc - halfWidth); x &lt;= Math.min(NX - 1, xc + halfWidth); x++) {
          sum += cube[idx(x, position, v)];
        }
      }
      pv[v * positionCount + position] = sum;
      max = Math.max(max, sum);
    }
    return {
      pv, max, axis, positionCount, positionPixelSize: dx,
      velocityCount: NV, channelWidth: dvChan, velocityMin: -cubeVmax
    };
  }

  function prepareCanvas(canvas, colors) {
    const ctx = canvas.getContext(&#x27;2d&#x27;);
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, W, H);
    return {
      ctx, W, H,
      left: 88, right: 22, top: 18, bottom: 64,
      axisFont: 24, tickFont: 20
    };
  }

  function drawAxes(g, xlabel, ylabel, colors, bounds = g, xRadius = XMAX, showSpatialY = false) {
    const { ctx, W, H, axisFont, tickFont } = g;
    const { left, right, top, bottom } = bounds;
    ctx.strokeStyle = colors.border;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left, top);
    ctx.lineTo(left, H - bottom);
    ctx.lineTo(W - right, H - bottom);
    ctx.stroke();
    ctx.fillStyle = colors.fg;
    ctx.font = `${axisFont}px sans-serif`;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(xlabel, (left + W - right) / 2, H - 13);
    ctx.save();
    ctx.translate(22, (top + H - bottom) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(ylabel, 0, 0);
    ctx.restore();
    ctx.font = `${tickFont}px sans-serif`;
    ctx.fillStyle = colors.muted;
    const tickY = H - bottom + 27;
    const digits = xRadius &lt; 1 ? 2 : 1;
    ctx.fillText(`-${xRadius.toFixed(digits)}`, left, tickY);
    ctx.fillText(&#x27;0&#x27;, (left + W - right) / 2, tickY);
    ctx.fillText(`+${xRadius.toFixed(digits)}`, W - right, tickY);
    if (showSpatialY) {
      ctx.textAlign = &#x27;right&#x27;;
      const yDigits = xRadius &lt; 1 ? 2 : 1;
      ctx.fillText(`+${xRadius.toFixed(yDigits)}`, left - 8, top + 8);
      ctx.fillText(&#x27;0&#x27;, left - 8, (top + H - bottom) / 2 + 8);
      ctx.fillText(`-${xRadius.toFixed(yDigits)}`, left - 8, H - bottom + 7);
      ctx.textAlign = &#x27;center&#x27;;
    }
  }

  function drawBeam(g, beamFwhm, colors, bounds = g, plotRadius = XMAX) {
    const { ctx, W, H } = g;
    const { left, right, top, bottom } = bounds;
    const pw = W - left - right, ph = H - top - bottom;
    const major = beamFwhm / (2 * plotRadius) * pw;
    const minor = 0.72 * major;
    const cx = left + 16 + major / 2;
    const cy = top + ph - 16 - minor / 2;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, major / 2, minor / 2, -0.35, 0, 2 * Math.PI);
    ctx.fillStyle = colors.bg;
    ctx.fill();
    ctx.strokeStyle = colors.fg;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
  }

  // Lightweight marching-squares contours for the canvas maps and PV diagrams.
  function drawContours(ctx, data, nx, ny, levels, toCanvas, styleForLevel) {
    for (const level of levels) {
      const style = styleForLevel(level);
      ctx.save();
      ctx.strokeStyle = style.color;
      ctx.lineWidth = style.width;
      ctx.globalAlpha = style.alpha ?? 1;
      for (let y = 0; y &lt; ny - 1; y++) for (let x = 0; x &lt; nx - 1; x++) {
        const a = data[y * nx + x];
        const b = data[y * nx + x + 1];
        const c = data[(y + 1) * nx + x + 1];
        const d = data[(y + 1) * nx + x];
        const crosses = [];
        const addCrossing = (v1, v2, x1, y1, x2, y2) =&gt; {
          if ((v1 &lt; level &amp;&amp; v2 &gt;= level) || (v1 &gt;= level &amp;&amp; v2 &lt; level)) {
            const f = (level - v1) / (v2 - v1);
            crosses.push([x1 + f * (x2 - x1), y1 + f * (y2 - y1)]);
          }
        };
        addCrossing(a, b, x, y, x + 1, y);
        addCrossing(b, c, x + 1, y, x + 1, y + 1);
        addCrossing(c, d, x + 1, y + 1, x, y + 1);
        addCrossing(d, a, x, y + 1, x, y);
        for (let k = 0; k + 1 &lt; crosses.length; k += 2) {
          const p1 = toCanvas(crosses[k][0], crosses[k][1]);
          const p2 = toCanvas(crosses[k + 1][0], crosses[k + 1][1]);
          ctx.beginPath();
          ctx.moveTo(p1[0], p1[1]);
          ctx.lineTo(p2[0], p2[1]);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  function drawMap(canvas, moment, type, colors, beamFwhm, plotRadius) {
    const g = prepareCanvas(canvas, colors);
    const { ctx, W, H, left, right, top, bottom } = g;
    const pw = W - left - right, ph = H - top - bottom;
    // The two spatial axes cover identical ranges, so force a square plotting
    // region. This preserves the projected axis ratio b/a = cos(inclination).
    const plotSize = Math.min(pw, ph);
    const plotLeft = left + (pw - plotSize) / 2;
    const plotTop = top + (ph - plotSize) / 2;
    const mapBounds = {
      left: plotLeft,
      right: W - plotLeft - plotSize,
      top: plotTop,
      bottom: H - plotTop - plotSize
    };
    const pixelSize = dx / (2 * plotRadius) * plotSize;
    const threshold = moment.max0 * 0.025;
    ctx.save();
    ctx.beginPath();
    ctx.rect(plotLeft, plotTop, plotSize, plotSize);
    ctx.clip();
    for (let y = 0; y &lt; NY; y++) for (let x = 0; x &lt; NX; x++) {
      const k = y * NX + x;
      let color;
      if (type === &#x27;m0&#x27;) {
        const t = Math.min(1, moment.m0[k] / moment.max0);
        color = colors.intensity[Math.round(100 * Math.pow(t, 0.55))];
      } else if (moment.m0[k] &lt; threshold) {
        color = colors.bg;
      } else if (type === &#x27;m1&#x27;) {
        const vel = Math.max(-220, Math.min(220, moment.m1[k]));
        color = colors.diverging[Math.round(50 + 50 * vel / 220)];
      } else {
        const dispersion = Math.max(0, Math.min(70, moment.m2[k]));
        color = colors.dispersion[Math.round(100 * dispersion / 70)];
      }
      ctx.fillStyle = color;
      const xCenter = (x - (NX - 1) / 2) * dx;
      const yCenter = (y - (NY - 1) / 2) * dx;
      ctx.fillRect(
        plotLeft + (xCenter - dx / 2 + plotRadius) / (2 * plotRadius) * plotSize,
        plotTop + (plotRadius - yCenter - dx / 2) / (2 * plotRadius) * plotSize,
        pixelSize + 0.6, pixelSize + 0.6
      );
    }
    const toCanvas = (x, y) =&gt; [
      plotLeft + ((x - (NX - 1) / 2) * dx + plotRadius) / (2 * plotRadius) * plotSize,
      plotTop + (plotRadius - (y - (NY - 1) / 2) * dx) / (2 * plotRadius) * plotSize
    ];
    if (type === &#x27;m0&#x27;) {
      // Fixed fractional levels: identical for the disk and merger maps.
      const intensityLevels = [0.08, 0.16, 0.32, 0.50, 0.70].map(f =&gt; f * moment.max0);
      drawContours(ctx, moment.m0, NX, NY, intensityLevels, toCanvas,
        () =&gt; ({ color: &#x27;#111111&#x27;, width: 1.3, alpha: 0.9 }));
    } else if (type === &#x27;m1&#x27;) {
      const velocityLevels = [];
      for (let v = -210; v &lt;= 210; v += 30) velocityLevels.push(v);
      const maskedVelocity = new Float32Array(moment.m1.length);
      for (let k = 0; k &lt; moment.m1.length; k++) {
        maskedVelocity[k] = moment.m0[k] &lt; threshold ? NaN : moment.m1[k];
      }
      drawContours(ctx, maskedVelocity, NX, NY, velocityLevels, toCanvas,
        v =&gt; ({ color: &#x27;#151515&#x27;, width: v === 0 ? 3.3 : 1.0, alpha: v === 0 ? 1 : 0.86 }));
    } else {
      const intensityLevels = [0.16, 0.32, 0.50, 0.70].map(f =&gt; f * moment.max0);
      drawContours(ctx, moment.m0, NX, NY, intensityLevels, toCanvas,
        () =&gt; ({ color: &#x27;#151515&#x27;, width: 1.0, alpha: 0.82 }));
    }
    ctx.restore();
    drawBeam(g, beamFwhm, colors, mapBounds, plotRadius);
    drawAxes(g, &#x27;Offset (kpc)&#x27;, &#x27;Offset (kpc)&#x27;, colors, mapBounds, plotRadius, true);
  }

  function drawPV(canvas, pvData, colors, intrinsicCurve = null, plotRadius = XMAX, plotVmax = DISPLAY_VMAX) {
    const g = prepareCanvas(canvas, colors);
    const { ctx, W, H, left, right, top, bottom } = g;
    const pw = W - left - right, ph = H - top - bottom;
    const positionCount = pvData.positionCount;
    const velocityCount = pvData.velocityCount;
    const positionPixelSize = pvData.positionPixelSize;
    const cw = positionPixelSize / (2 * plotRadius) * pw;
    const ch = pvData.channelWidth / (2 * plotVmax) * ph;
    ctx.save();
    ctx.beginPath();
    ctx.rect(left, top, pw, ph);
    ctx.clip();
    for (let v = 0; v &lt; velocityCount; v++) for (let x = 0; x &lt; positionCount; x++) {
      const t = pvData.max &gt; 0 ? Math.min(1, pvData.pv[v * positionCount + x] / pvData.max) : 0;
      ctx.fillStyle = colors.pv[Math.round(100 * Math.pow(t, 0.55))];
      const xCenter = (x - (positionCount - 1) / 2) * positionPixelSize;
      const velocity = pvData.velocityMin + v * pvData.channelWidth;
      const py = top + (plotVmax - velocity) / (2 * plotVmax) * ph;
      ctx.fillRect(left + (xCenter - positionPixelSize / 2 + plotRadius) / (2 * plotRadius) * pw, py - ch / 2, cw + 0.6, ch + 0.6);
    }
    const toCanvas = (x, v) =&gt; [
      left + ((x - (positionCount - 1) / 2) * positionPixelSize + plotRadius) / (2 * plotRadius) * pw,
      top + (plotVmax - (pvData.velocityMin + v * pvData.channelWidth)) / (2 * plotVmax) * ph
    ];
    // Fixed fractional levels: identical for disk and merger PV diagrams.
    const intensityLevels = [0.12, 0.25, 0.50, 0.75].map(f =&gt; f * pvData.max);
    drawContours(ctx, pvData.pv, positionCount, velocityCount, intensityLevels, toCanvas,
      () =&gt; ({ color: &#x27;#b00016&#x27;, width: 1.4, alpha: 0.95 }));
    if (intrinsicCurve) {
      ctx.save();
      ctx.strokeStyle = &#x27;#00a6d6&#x27;;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([7, 5]);
      const centralRadius = 0.025;
      const samplesPerBranch = 160;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        for (let k = 0; k &lt;= samplesPerBranch; k++) {
          const fraction = k / samplesPerBranch;
          const radius = side &lt; 0
            ? plotRadius - fraction * (plotRadius - centralRadius)
            : centralRadius + fraction * (plotRadius - centralRadius);
          const x = side * radius;
          const velocity = side * intrinsicCurve(radius);
          const y = top + (plotVmax - velocity) / (2 * plotVmax) * ph;
          const px = left + (x + plotRadius) / (2 * plotRadius) * pw;
          if (k === 0) ctx.moveTo(px, y);
          else ctx.lineTo(px, y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
    const positionLabel = pvData.axis === &#x27;minor&#x27; ? &#x27;Minor-axis offset (kpc)&#x27; : &#x27;Major-axis offset (kpc)&#x27;;
    drawAxes(g, positionLabel, &#x27;Velocity (km s⁻¹)&#x27;, colors, g, plotRadius);
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const y0 = top + ph / 2;
    ctx.moveTo(left, y0);
    ctx.lineTo(W - right, y0);
    ctx.stroke();
    ctx.fillStyle = colors.muted;
    ctx.font = `${g.tickFont}px sans-serif`;
    ctx.textAlign = &#x27;right&#x27;;
    ctx.fillText(`+${plotVmax}`, left - 8, top + 8);
    ctx.fillText(&#x27;0&#x27;, left - 8, y0 + 8);
    ctx.fillText(`-${plotVmax}`, left - 8, top + ph + 8);
  }

  function drawSpectrum(canvas, spectrum, colors, lineColor, plotVmax = DISPLAY_VMAX) {
    const g = prepareCanvas(canvas, colors);
    const { ctx, W, H, left, right, top, bottom } = g;
    const pw = W - left - right, ph = H - top - bottom;
    const baseline = H - bottom;

    ctx.strokeStyle = colors.border;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left, top);
    ctx.lineTo(left, baseline);
    ctx.lineTo(W - right, baseline);
    ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.rect(left, top, pw, ph);
    ctx.clip();
    ctx.beginPath();
    for (let v = 0; v &lt; spectrum.flux.length; v++) {
      const velocity = spectrum.velocityMin + v * spectrum.channelWidth;
      const normalized = spectrum.max &gt; 0 ? spectrum.flux[v] / spectrum.max : 0;
      const py = baseline - normalized * ph * 0.92;
      const leftEdge = left + (velocity - spectrum.channelWidth / 2 + plotVmax) / (2 * plotVmax) * pw;
      const rightEdge = left + (velocity + spectrum.channelWidth / 2 + plotVmax) / (2 * plotVmax) * pw;
      if (v === 0) ctx.moveTo(leftEdge, py);
      else ctx.lineTo(leftEdge, py);
      ctx.lineTo(rightEdge, py);
    }
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = colors.fg;
    ctx.font = `${g.axisFont}px sans-serif`;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;Velocity (km s⁻¹)&#x27;, (left + W - right) / 2, H - 13);
    ctx.save();
    ctx.translate(22, (top + baseline) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(&#x27;Normalized flux&#x27;, 0, 0);
    ctx.restore();

    ctx.fillStyle = colors.muted;
    ctx.font = `${g.tickFont}px sans-serif`;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(`-${plotVmax}`, left, baseline + 27);
    ctx.fillText(&#x27;0&#x27;, left + pw / 2, baseline + 27);
    ctx.fillText(`+${plotVmax}`, W - right, baseline + 27);
    ctx.textAlign = &#x27;right&#x27;;
    ctx.fillText(&#x27;1&#x27;, left - 8, top + 14);
    ctx.fillText(&#x27;0&#x27;, left - 8, baseline + 7);
  }

  let renderTimer;
  let diskCache = null;
  let mergerCache = null;
  function spatialFwhm(input) {
    return Number(input.value);
  }

  function updateResolutionLabels() {
    diskSpatialValue.textContent = spatialFwhm(diskSpatialInput).toFixed(2);
    mergerSpatialValue.textContent = spatialFwhm(mergerSpatialInput).toFixed(2);
    diskVelocityValue.textContent = Number(diskVelocityInput.value).toFixed(0);
    mergerVelocityValue.textContent = Number(mergerVelocityInput.value).toFixed(0);
  }

  function render() {
    const inclinationDeg = Number(incInput.value);
    const inclination = inclinationDeg * Math.PI / 180;
    const diskBeam = spatialFwhm(diskSpatialInput);
    const mergerBeam = spatialFwhm(mergerSpatialInput);
    const diskVelocityResolution = Number(diskVelocityInput.value);
    const mergerVelocityResolution = Number(mergerVelocityInput.value);
    const diskPlotRadius = displayRadius(diskBeam);
    const mergerPlotRadius = displayRadius(mergerBeam);
    const deltaV = Number(dvInput.value);
    const mergerSeparation = Number(separationInput.value);
    const curveType = curveInput.value;
    const bulgeMass = 10 ** Number(bulgeMassInput.value);
    const blackHoleMass = 10 ** Number(bhMassInput.value);
    incValue.textContent = inclinationDeg.toFixed(0);
    incAssumption.textContent = inclinationDeg.toFixed(0);
    curveAssumption.textContent = curveInput.options[curveInput.selectedIndex].text.toLowerCase();
    const formattedBulgeMass = formatMassHTML(bulgeMass);
    bulgeMassValue.innerHTML = formattedBulgeMass;
    bulgeMassAssumption.innerHTML = formattedBulgeMass;
    bulgeFractionAssumption.textContent = formatMassFraction(bulgeMass);
    const formattedBlackHoleMass = formatMassHTML(blackHoleMass);
    bhMassValue.innerHTML = formattedBlackHoleMass;
    bhMassAssumption.innerHTML = formattedBlackHoleMass;
    bhFractionAssumption.textContent = formatMassFraction(blackHoleMass);
    updateResolutionLabels();
    dvValue.textContent = deltaV.toFixed(0);
    separationValue.textContent = mergerSeparation.toFixed(2);
    separationAssumption.textContent = mergerSeparation.toFixed(2);
    const inferredV = (deltaV / 2) / Math.sin(inclination);
    mergerRatio.textContent = `Disk-fit V/σ ≈ ${(inferredV / sigma).toFixed(1)}`;

    const colors = palette();
    const diskKey = JSON.stringify([
      inclinationDeg, diskBeam, diskVelocityResolution, curveType,
      bulgeMassInput.value, bhMassInput.value
    ]);
    const mergerKey = JSON.stringify([
      mergerBeam, mergerVelocityResolution, deltaV, mergerSeparation
    ]);
    const diskChanged = !diskCache || diskCache.key !== diskKey;
    const mergerChanged = !mergerCache || mergerCache.key !== mergerKey;
    const diskSpectralExtent = diskVelocityExtent(
      inclination, curveType, bulgeMass, blackHoleMass, diskVelocityResolution
    );
    const mergerSpectralExtent = mergerVelocityExtent(deltaV, mergerVelocityResolution);
    const diskVisibleVmax = diskVisibleVelocityLimit(
      inclination, curveType, bulgeMass, blackHoleMass
    );
    const mergerVisibleVmax = visibleVelocityLimit(mergerSpectralExtent, mergerVelocityResolution);
    if (diskChanged) {
      setSampling(diskBeam, diskVelocityResolution, diskSpectralExtent);
      const cube = convolveSpectral(
        convolveSpatial(buildCube(&#x27;disk&#x27;, deltaV, inclination, curveType, mergerSeparation, bulgeMass, blackHoleMass), diskBeam),
        diskVelocityResolution
      );
      diskCache = {
        key: diskKey,
        moment: moments(cube),
        majorPV: pvDiagram(cube, &#x27;major&#x27;),
        minorPV: pvDiagram(cube, &#x27;minor&#x27;),
        spectrum: globalSpectrum(cube)
      };
    }

    if (mergerChanged) {
      setSampling(mergerBeam, mergerVelocityResolution, mergerSpectralExtent);
      const cube = convolveSpectral(
        convolveSpatial(buildCube(&#x27;merger&#x27;, deltaV, inclination, curveType, mergerSeparation, bulgeMass, blackHoleMass), mergerBeam),
        mergerVelocityResolution
      );
      mergerCache = {
        key: mergerKey,
        moment: moments(cube),
        majorPV: pvDiagram(cube, &#x27;major&#x27;),
        minorPV: pvDiagram(cube, &#x27;minor&#x27;),
        spectrum: globalSpectrum(cube)
      };
    }

    if (diskChanged) {
      setSampling(diskBeam, diskVelocityResolution, diskSpectralExtent);
      drawMap(document.getElementById(&#x27;dmc-disk-m0&#x27;), diskCache.moment, &#x27;m0&#x27;, colors, diskBeam, diskPlotRadius);
      drawMap(document.getElementById(&#x27;dmc-disk-m1&#x27;), diskCache.moment, &#x27;m1&#x27;, colors, diskBeam, diskPlotRadius);
      drawMap(document.getElementById(&#x27;dmc-disk-m2&#x27;), diskCache.moment, &#x27;m2&#x27;, colors, diskBeam, diskPlotRadius);
      drawPV(
        document.getElementById(&#x27;dmc-disk-major-pv&#x27;),
        diskCache.majorPV,
        colors,
        radius =&gt; rotationSpeed(radius, curveType, bulgeMass, blackHoleMass) * Math.sin(inclination),
        diskPlotRadius,
        diskVisibleVmax
      );
      drawPV(
        document.getElementById(&#x27;dmc-disk-minor-pv&#x27;),
        diskCache.minorPV,
        colors,
        null,
        diskPlotRadius,
        diskVisibleVmax
      );
      drawSpectrum(
        document.getElementById(&#x27;dmc-disk-spectrum&#x27;),
        diskCache.spectrum,
        colors,
        &#x27;#006f9e&#x27;,
        diskVisibleVmax
      );
    }

    if (mergerChanged) {
      setSampling(mergerBeam, mergerVelocityResolution, mergerSpectralExtent);
      drawMap(document.getElementById(&#x27;dmc-merger-m0&#x27;), mergerCache.moment, &#x27;m0&#x27;, colors, mergerBeam, mergerPlotRadius);
      drawMap(document.getElementById(&#x27;dmc-merger-m1&#x27;), mergerCache.moment, &#x27;m1&#x27;, colors, mergerBeam, mergerPlotRadius);
      drawMap(document.getElementById(&#x27;dmc-merger-m2&#x27;), mergerCache.moment, &#x27;m2&#x27;, colors, mergerBeam, mergerPlotRadius);
      drawPV(
        document.getElementById(&#x27;dmc-merger-major-pv&#x27;),
        mergerCache.majorPV,
        colors,
        null,
        mergerPlotRadius,
        mergerVisibleVmax
      );
      drawPV(
        document.getElementById(&#x27;dmc-merger-minor-pv&#x27;),
        mergerCache.minorPV,
        colors,
        null,
        mergerPlotRadius,
        mergerVisibleVmax
      );
      drawSpectrum(
        document.getElementById(&#x27;dmc-merger-spectrum&#x27;),
        mergerCache.spectrum,
        colors,
        &#x27;#9e0022&#x27;,
        mergerVisibleVmax
      );
    }

    // Compare the centre separation with the beam-broadened component size,
    // and the velocity separation with the spectrally broadened line width.
    const componentSpatialFwhm = 2.355 * 0.27;
    const effectiveSpatialFwhm = Math.hypot(componentSpatialFwhm, mergerBeam);
    const effectiveLineFwhm = Math.hypot(2.355 * sigma, mergerVelocityResolution);
    const spatiallyResolved = mergerSeparation / effectiveSpatialFwhm &gt;= 1.5;
    const spectrallyResolved = deltaV / effectiveLineFwhm &gt;= 1.5;

    if (spatiallyResolved &amp;&amp; spectrallyResolved) {
      note.textContent = &#x27;The components are resolved in position and velocity; their two-component nature should remain visible despite the connecting bridge.&#x27;;
    } else if (spatiallyResolved) {
      note.textContent = &#x27;The components are spatially distinct, but their line profiles overlap; the PV diagram is smoother than the moment-0 morphology.&#x27;;
    } else if (spectrallyResolved) {
      note.textContent = &#x27;The components blend on the sky but remain separated in velocity; their moment-1 map can still resemble a smooth “rotating” gradient.&#x27;;
    } else {
      note.textContent = &#x27;At these settings, spatial and spectral blending merge the two components into a smooth red-to-blue gradient; the bridge reinforces the disk-like appearance.&#x27;;
    }
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 150);
  }

  incInput.addEventListener(&#x27;input&#x27;, scheduleRender);
  curveInput.addEventListener(&#x27;change&#x27;, updateMassControls);
  bulgeMassInput.addEventListener(&#x27;input&#x27;, () =&gt; updateBulgeControl(true));
  bhMassInput.addEventListener(&#x27;input&#x27;, () =&gt; updateBlackHoleControl(true));
  function syncResolution(source, target, syncInput) {
    if (syncInput.checked) target.value = source.value;
    updateResolutionLabels();
  }

  function updateSyncState(renderAfter = true) {
    mergerSpatialInput.disabled = syncSpatialInput.checked;
    mergerVelocityInput.disabled = syncVelocityInput.checked;
    root.querySelectorAll(&#x27;[data-target=&quot;dmc-spatial-merger&quot;]&#x27;).forEach(button =&gt; button.disabled = mergerSpatialInput.disabled);
    root.querySelectorAll(&#x27;[data-target=&quot;dmc-velocity-merger&quot;]&#x27;).forEach(button =&gt; button.disabled = mergerVelocityInput.disabled);
    if (syncSpatialInput.checked) mergerSpatialInput.value = diskSpatialInput.value;
    if (syncVelocityInput.checked) mergerVelocityInput.value = diskVelocityInput.value;
    updateResolutionLabels();
    if (renderAfter) scheduleRender();
  }

  diskSpatialInput.addEventListener(&#x27;input&#x27;, () =&gt; syncResolution(diskSpatialInput, mergerSpatialInput, syncSpatialInput));
  mergerSpatialInput.addEventListener(&#x27;input&#x27;, updateResolutionLabels);
  diskVelocityInput.addEventListener(&#x27;input&#x27;, () =&gt; syncResolution(diskVelocityInput, mergerVelocityInput, syncVelocityInput));
  mergerVelocityInput.addEventListener(&#x27;input&#x27;, updateResolutionLabels);
  diskSpatialInput.addEventListener(&#x27;change&#x27;, scheduleRender);
  mergerSpatialInput.addEventListener(&#x27;change&#x27;, scheduleRender);
  diskVelocityInput.addEventListener(&#x27;change&#x27;, scheduleRender);
  mergerVelocityInput.addEventListener(&#x27;change&#x27;, scheduleRender);
  syncSpatialInput.addEventListener(&#x27;change&#x27;, updateSyncState);
  syncVelocityInput.addEventListener(&#x27;change&#x27;, updateSyncState);
  dvInput.addEventListener(&#x27;input&#x27;, scheduleRender);
  separationInput.addEventListener(&#x27;input&#x27;, () =&gt; {
    separationValue.textContent = Number(separationInput.value).toFixed(2);
    separationAssumption.textContent = Number(separationInput.value).toFixed(2);
    scheduleRender();
  });
  root.querySelectorAll(&#x27;.dmc-step&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const input = document.getElementById(button.dataset.target);
      if (input.disabled) return;
      const step = Number(input.step) || 1;
      const next = Math.min(Number(input.max), Math.max(Number(input.min), Number(input.value) + Number(button.dataset.direction) * step));
      if (next === Number(input.value)) return;
      input.value = String(next);
      input.dispatchEvent(new Event(&#x27;input&#x27;, { bubbles: true }));
      input.dispatchEvent(new Event(&#x27;change&#x27;, { bubbles: true }));
    });
  });
  updateSyncState(false);
  updateMassControls(false);
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
